services:
  mysql:
    image: mysql:8.4
    container_name: gsc-order-manager-mysql
    environment:
      MYSQL_DATABASE: gsc_order_manager
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsc-order-manager-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gsc_order_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SECURITY_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000
      APP_SECURITY_DEFAULT_ADMIN_EMAIL: admin@gsc.local
      APP_SECURITY_DEFAULT_ADMIN_PASSWORD: Admin@123
      APP_SECURITY_DEFAULT_ADMIN_FULL_NAME: System Administrator
      APP_SECURITY_DEFAULT_ADMIN_DEPARTMENT: Administration
      APP_BACKUP_DIRECTORY: /app/backups
      APP_BACKUP_MYSQLDUMP_COMMAND: mysqldump
      APP_BACKUP_MYSQL_COMMAND: mysql
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    volumes:
      - D:/gsc-order-manager-backups:/app/backups
    restart: on-failure

volumes:
  mysql_data:
