spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gsc_order_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8080}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.security.jwt.access-token-expiration-ms=${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
app.security.default-admin.email=${APP_SECURITY_DEFAULT_ADMIN_EMAIL:admin@gsc.local}
app.security.default-admin.password=${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:Admin@123}
app.security.default-admin.full-name=${APP_SECURITY_DEFAULT_ADMIN_FULL_NAME:System Administrator}
app.security.default-admin.department=${APP_SECURITY_DEFAULT_ADMIN_DEPARTMENT:Administration}
